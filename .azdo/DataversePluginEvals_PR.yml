#
# Pull request evaluation gate for the Dataverse skills plugin.
#
# This file only declares when the gate runs. The evaluation itself (test
# corpus, agent model, runner version and secrets) is defined in the template
# referenced below, so changes to the evaluation do not require changes here.

trigger:
  branches:
    include:
    - main

pr:
  branches:
    include:
    - main

resources:
  repositories:
  - repository: dataversePlugin
    type: github
    endpoint: bic-proxima-shared-stamp
    name: bic/dataverse-plugin
    ref: refs/heads/main

extends:
  template: evals/.pipelines/templates/dataverse-skills-pr-gate.yml@dataversePlugin
