name: Skill Evals

on:
  pull_request:
    # No path filter: "Static skill checks" is a required status check for every PR to main.
    # If we filtered by paths, PRs that don't touch skill/eval files would never trigger this
    # workflow, causing those PRs to be permanently blocked waiting for a check that never runs.
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    name: Static skill checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # needed for version_bump_check.py to compare against main

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install eval dependencies (tiktoken for CAT-8, pyyaml for CAT-4 STRUCT-05)
        run: pip install tiktoken pyyaml

      - name: Run static eval suite
        run: python .github/evals/static_checks.py

      - name: Validate Gemini extension
        run: npx --yes --package @google/gemini-cli@0.61.0-nightly.20260910.ged2ac40df gemini extensions validate .github/plugins/dataverse

      - name: Run auth unit tests
        run: python .github/evals/test_auth.py

      - name: Run version bump check
        run: python .github/evals/version_bump_check.py --base origin/main
