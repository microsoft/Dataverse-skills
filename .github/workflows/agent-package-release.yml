name: Publish Gemini Extension

on:
  push:
    branches: [main]
    paths:
      - '.github/plugins/dataverse/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-extension-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Gemini extension
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install eval dependencies
        run: pip install tiktoken pyyaml

      - name: Run static checks
        run: python .github/evals/static_checks.py

      - name: Validate Gemini extension
        run: npx --yes --package @google/gemini-cli@latest gemini extensions validate .github/plugins/dataverse

  publish:
    name: Create Gemini extension release
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read release version
        id: version
        run: |
          version=$(jq -r .version .github/plugins/dataverse/gemini-extension.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Require a new release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists. Bump the plugin version for canonical package changes."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Bump the plugin version for canonical package changes."
            exit 1
          fi

      - name: Build Gemini extension package
        run: >-
          git archive --format=zip
          --output=dataverse-gemini-extension.zip
          HEAD:.github/plugins/dataverse

      - name: Verify package root
        run: |
          unzip -Z1 dataverse-gemini-extension.zip > package-files.txt
          grep -Fxq gemini-extension.json package-files.txt
          grep -Fxq skills/dv-connect/SKILL.md package-files.txt
          grep -Fxq scripts/auth.py package-files.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: >-
          gh release create "$RELEASE_TAG"
          dataverse-gemini-extension.zip
          --target "$GITHUB_SHA"
          --title "$RELEASE_TAG"
          --generate-notes