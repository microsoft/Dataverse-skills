name: Publish Agent Package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Attach Gemini and Antigravity package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run static checks
        run: python .github/evals/static_checks.py

      - name: Validate Gemini extension
        run: npx --yes --package @google/gemini-cli@0.61.0-nightly.20260910.ged2ac40df gemini extensions validate .github/plugins/dataverse

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version=$(python -c "import json; print(json.load(open('.github/plugins/dataverse/gemini-extension.json'))['version'])")
          if [ "$RELEASE_TAG" != "$package_version" ] && [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

      - name: Build shared agent package
        run: >-
          git archive --format=zip
          --output=dataverse-agent-plugin.zip
          HEAD:.github/plugins/dataverse

      - name: Verify package root
        run: |
          unzip -Z1 dataverse-agent-plugin.zip > package-files.txt
          grep -Fxq gemini-extension.json package-files.txt
          grep -Fxq plugin.json package-files.txt
          grep -Fxq skills/dv-connect/SKILL.md package-files.txt
          grep -Fxq scripts/auth.py package-files.txt

      - name: Attach shared agent package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dataverse-agent-plugin.zip --clobber